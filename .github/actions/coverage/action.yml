name: Coverage
description: Report line coverage over the lines this pull request adds, and fail below a threshold

inputs:
  github-token:
    description: Token used to read the pull request diff and post the coverage comment
    required: true
  threshold:
    description: Minimum percentage of added, instrumented lines that must be covered
    required: false
    default: '80'
  lcov-path:
    description: Path to the lcov report produced by the test run
    required: false
    default: coverage/lcov.info
  path-prefix:
    description: 'Prefix to prepend to lcov SF: paths so they match repo-root-relative PR file paths'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Report patch coverage
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
      env:
        COVERAGE_THRESHOLD: ${{ inputs.threshold }}
        COVERAGE_LCOV_PATH: ${{ inputs.lcov-path }}
        COVERAGE_PATH_PREFIX: ${{ inputs.path-prefix }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fileSystem = require('node:fs');

          const coverageCommentMarker = '<!-- apollo-patch-coverage -->';
          const coverageThresholdPercentage = Number(process.env.COVERAGE_THRESHOLD);
          const lcovReportPath = process.env.COVERAGE_LCOV_PATH;
          const coveragePathPrefix = process.env.COVERAGE_PATH_PREFIX ?? '';

          if (!fileSystem.existsSync(lcovReportPath)) {
            core.setFailed(
              `No lcov report at ${lcovReportPath}. The test step must run before this action.`,
            );
            return;
          }

          function parseLcovHitCountByLineNumber(lcovReportText) {
            const hitCountByLineNumberByFilePath = new Map();
            let currentFilePath = null;
            for (const reportLine of lcovReportText.split('\n')) {
              if (reportLine.startsWith('SF:')) {
                currentFilePath =
                  coveragePathPrefix + reportLine.slice(3).trim().replace(/^\.\//, '');
                if (!hitCountByLineNumberByFilePath.has(currentFilePath)) {
                  hitCountByLineNumberByFilePath.set(currentFilePath, new Map());
                }
                continue;
              }
              if (reportLine.startsWith('end_of_record')) {
                currentFilePath = null;
                continue;
              }
              if (currentFilePath === null || !reportLine.startsWith('DA:')) {
                continue;
              }
              const [rawLineNumber, rawHitCount] = reportLine.slice(3).split(',');
              const lineNumber = Number(rawLineNumber);
              const hitCount = Number(rawHitCount);
              if (Number.isNaN(lineNumber) || Number.isNaN(hitCount)) {
                continue;
              }
              hitCountByLineNumberByFilePath.get(currentFilePath).set(lineNumber, hitCount);
            }
            return hitCountByLineNumberByFilePath;
          }

          function parseAddedLineNumberList(filePatch) {
            const addedLineNumberList = [];
            let currentLineNumber = 0;
            for (const patchLine of filePatch.split('\n')) {
              const hunkHeaderMatch = patchLine.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
              if (hunkHeaderMatch !== null) {
                currentLineNumber = Number(hunkHeaderMatch[1]);
                continue;
              }
              // "\ No newline at end of file" annotates the preceding line
              // rather than being one, so counting it shifts every line after.
              if (
                patchLine.startsWith('+++') ||
                patchLine.startsWith('---') ||
                patchLine.startsWith('\\')
              ) {
                continue;
              }
              if (patchLine.startsWith('+')) {
                addedLineNumberList.push(currentLineNumber);
                currentLineNumber += 1;
                continue;
              }
              if (patchLine.startsWith('-')) {
                continue;
              }
              currentLineNumber += 1;
            }
            return addedLineNumberList;
          }

          const hitCountByLineNumberByFilePath = parseLcovHitCountByLineNumber(
            fileSystem.readFileSync(lcovReportPath, 'utf8'),
          );

          const changedFileList = await github.paginate(github.rest.pulls.listFiles, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
            per_page: 100,
          });

          let coveredAddedLineCount = 0;
          let instrumentedAddedLineCount = 0;
          const uncoveredFileSummaryList = [];
          const unmeasuredFileList = [];

          for (const changedFile of changedFileList) {
            if (changedFile.status === 'removed') {
              continue;
            }
            const hitCountByLineNumber = hitCountByLineNumberByFilePath.get(
              changedFile.filename,
            );
            // The API omits `patch` on very large diffs. Those lines are
            // instrumented but unmeasurable, and silently dropping them would
            // report a coverage number that looks like full coverage.
            if (changedFile.patch === undefined) {
              if (hitCountByLineNumber !== undefined) {
                unmeasuredFileList.push(changedFile.filename);
              }
              continue;
            }
            if (hitCountByLineNumber === undefined) {
              continue;
            }
            let fileCoveredCount = 0;
            let fileInstrumentedCount = 0;
            for (const addedLineNumber of parseAddedLineNumberList(changedFile.patch)) {
              const hitCount = hitCountByLineNumber.get(addedLineNumber);
              if (hitCount === undefined) {
                continue;
              }
              fileInstrumentedCount += 1;
              if (hitCount > 0) {
                fileCoveredCount += 1;
              }
            }
            coveredAddedLineCount += fileCoveredCount;
            instrumentedAddedLineCount += fileInstrumentedCount;
            if (fileInstrumentedCount > fileCoveredCount) {
              uncoveredFileSummaryList.push(
                `| \`${changedFile.filename}\` | ${fileCoveredCount}/${fileInstrumentedCount} |`,
              );
            }
          }

          if (instrumentedAddedLineCount === 0) {
            core.info('No instrumented lines were added by this pull request.');
            return;
          }

          const patchCoveragePercentage =
            (coveredAddedLineCount / instrumentedAddedLineCount) * 100;
          const isAboveThreshold = patchCoveragePercentage >= coverageThresholdPercentage;
          const resultLabel = isAboveThreshold ? '✅' : '❌';

          const commentBodySectionList = [
            coverageCommentMarker,
            `### ${resultLabel} Patch coverage: ${patchCoveragePercentage.toFixed(2)}%`,
            '',
            `${coveredAddedLineCount} of ${instrumentedAddedLineCount} added lines covered (threshold ${coverageThresholdPercentage}%).`,
          ];
          if (uncoveredFileSummaryList.length > 0) {
            commentBodySectionList.push(
              '',
              '| File | Covered |',
              '| --- | --- |',
              ...uncoveredFileSummaryList,
            );
          }
          if (unmeasuredFileList.length > 0) {
            commentBodySectionList.push(
              '',
              `⚠️ Not measured (diff too large for the API to return): ${unmeasuredFileList.join(', ')}`,
            );
          }
          const commentBody = commentBodySectionList.join('\n');

          // A pull request from a fork gets a read-only token, so commenting
          // 403s. The coverage verdict still stands; only the delivery is
          // best-effort, and the job summary always carries it.
          try {
            const existingCommentList = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );
            const previousCoverageComment = existingCommentList.find((comment) =>
              comment.body?.includes(coverageCommentMarker),
            );

            if (previousCoverageComment === undefined) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            } else {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previousCoverageComment.id,
                body: commentBody,
              });
            }
          } catch (error) {
            core.warning(
              `Could not post the coverage comment (forks get a read-only token): ${error.message}`,
            );
          }

          core.summary.addRaw(commentBody.replace(coverageCommentMarker, ''));
          await core.summary.write();

          if (!isAboveThreshold) {
            core.setFailed(
              `Patch coverage ${patchCoveragePercentage.toFixed(2)}% is below the ${coverageThresholdPercentage}% threshold.`,
            );
          }
